name: Validate

on:
  push:
  pull_request:
  schedule:
    # Taeglich, damit geaenderte Anforderungen von HACS/Home Assistant auffallen,
    # auch wenn am Repository gerade nicht gearbeitet wird.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # 'brands' prueft, ob unter home-assistant/brands Bilder fuer die
          # Domain hinterlegt sind. Die Dateien liegen fertig unter brands/,
          # sind aber noch nicht eingereicht - bis der PR dort durch ist, wuerde
          # der Check dauerhaft fehlschlagen. NACH dem Merge diese Zeile
          # entfernen.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      # hassfest prueft die manifest.json im ausgecheckten Stand und braucht
      # daher - anders als die HACS-Action - das Repository lokal.
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
